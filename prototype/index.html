<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Z-Read · 在线读书管理原型</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600;700&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet" />
  <style>
    :root {
      --wall: #dfe6df;
      --paper: #f6f3ec;
      --ink: #1a211c;
      --muted: #5e6a62;
      --line: #c5cfc6;
      --shelf: #5a4333;
      --shelf-edge: #3f2e22;
      --lamp: #c9842a;
      --lamp-soft: #f3e4c8;
      --raised: #f3f6f2;
      --weread: #2f6b52;
      --fanqie: #c0562a;
      --qidian: #1e4e86;
      --local: #6e5840;
      --jjwxc: #8a3d5b;
      --font: "Noto Sans SC", "PingFang SC", sans-serif;
      --display: "ZCOOL XiaoWei", "Noto Serif SC", serif;
      --mono: "IBM Plex Mono", ui-monospace, monospace;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: var(--font);
      background: var(--wall);
      color: var(--ink);
    }
    button, .chip { font-family: inherit; cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible {
      outline: 2px solid var(--lamp);
      outline-offset: 2px;
    }

    .obsidian { width: 100vw; height: 100vh; display: grid; grid-template-columns: 48px 1fr; overflow: hidden; }
    .ribbon {
      background: #eef2ed;
      border-right: 1px solid var(--line);
      display: flex; flex-direction: column; align-items: center;
      padding: 10px 0; gap: 8px;
    }
    .ribbon button {
      width: 32px; height: 32px; border: 0; border-radius: 8px;
      background: transparent; color: var(--muted); font-size: 16px;
    }
    .ribbon button.active { background: #fff; color: var(--weread); box-shadow: inset 2px 0 0 var(--weread); }

    .workspace { min-width: 0; display: grid; grid-template-rows: auto 1fr; }
    header {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      padding: 10px 16px; background: #f7f9f6; border-bottom: 1px solid var(--line);
    }
    .brand { font-family: var(--display); font-size: 22px; line-height: 1; }
    .brand small { font-family: var(--font); font-size: 12px; color: var(--muted); margin-left: 8px; font-weight: 500; }
    .tabs { display: flex; gap: 4px; flex-wrap: wrap; }
    .tabs button {
      border: 0; background: transparent; color: var(--muted);
      padding: 6px 12px; border-radius: 8px; font-size: 13px;
    }
    .tabs button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 0 var(--line); }
    .spacer { flex: 1; }
    .btn, .ghost, .chip {
      border-radius: 8px; font-size: 13px; padding: 7px 12px; border: 1px solid transparent;
    }
    .btn { background: var(--weread); color: #fff; font-weight: 600; border: 0; }
    .btn.lamp { background: var(--lamp); }
    .ghost { background: #fff; border-color: var(--line); color: var(--ink); }
    .chip {
      background: #fff; border-color: var(--line); color: var(--muted); font-size: 12px; padding: 4px 10px;
    }
    .chip.on { color: var(--weread); border-color: var(--weread); background: #e7f2ec; }

    main { min-height: 0; overflow: hidden; }
    .view { display: none; height: 100%; min-height: 0; }
    .view.on { display: grid; }

    #view-shelf { grid-template-columns: 220px 1fr; }
    .side {
      border-right: 1px solid var(--line);
      background: #f4f7f3;
      overflow: auto;
      padding: 14px;
    }
    .side h2, .pane-head h2, .reader-meta h1, .spec h2 { margin: 0; }
    .side h2 { font-size: 12px; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
    .src-list { display: flex; flex-direction: column; gap: 6px; margin: 10px 0 18px; }
    .src-list button {
      display: flex; align-items: center; gap: 8px;
      border: 0; background: transparent; text-align: left;
      padding: 8px 10px; border-radius: 8px; color: var(--ink); font-size: 13px;
    }
    .src-list button.on { background: #fff; }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .count { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--muted); }
    .side label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 6px; }
    select, input[type="search"], input[type="text"], input[type="url"], textarea {
      width: 100%; border: 1px solid var(--line); border-radius: 8px;
      padding: 8px 10px; background: #fff; color: var(--ink); font: inherit; font-size: 13px;
    }
    textarea { min-height: 88px; resize: vertical; }

    .library { overflow: auto; padding: 18px 22px 40px; }
    .lib-toolbar {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 16px;
    }
    .search { flex: 1; min-width: 180px; }
    .empty {
      border: 1px dashed var(--line); border-radius: 12px; padding: 28px;
      color: var(--muted); background: rgba(255,255,255,.45);
    }

    .shelf-block { margin: 0 0 28px; }
    .shelf-label {
      display: flex; align-items: baseline; gap: 10px;
      font-size: 13px; font-weight: 600; margin: 0 0 10px;
    }
    .shelf-label span { font-family: var(--mono); font-size: 11px; color: var(--muted); font-weight: 400; }
    .books {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(128px, 1fr));
      gap: 14px 12px;
      padding: 14px 12px 22px;
      background:
        linear-gradient(var(--wall), var(--wall)) padding-box,
        linear-gradient(#0000, #0000) border-box;
      border-bottom: 10px solid var(--shelf);
      box-shadow: 0 10px 0 var(--shelf-edge);
      border-radius: 4px 4px 0 0;
    }
    .book {
      appearance: none; border: 0; padding: 0; background: transparent;
      text-align: left; display: grid; gap: 8px;
    }
    .jacket {
      height: 168px; border-radius: 3px 8px 8px 3px;
      color: #f6f3ec; padding: 10px 8px 12px 14px;
      display: flex; flex-direction: column; justify-content: space-between;
      box-shadow: 4px 6px 12px rgba(26,33,28,.18);
      position: relative;
      background: linear-gradient(160deg, var(--c, var(--local)), #1a211c 120%);
    }
    .jacket::before {
      content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 8px;
      background: color-mix(in srgb, #fff 18%, var(--c, var(--local)));
      border-radius: 3px 0 0 3px;
    }
    .jacket b {
      font-family: var(--display); font-size: 18px; font-weight: 400;
      writing-mode: vertical-rl; letter-spacing: .12em;
      max-height: 118px; overflow: hidden;
    }
    .jacket i { font-style: normal; font-size: 10px; opacity: .8; }
    .book figcaption { display: grid; gap: 2px; }
    .book strong { font-size: 13px; font-weight: 600; line-height: 1.35; }
    .book em { font-style: normal; font-size: 11px; color: var(--muted); }
    .progress {
      height: 3px; background: #cfd8d1; border-radius: 99px; overflow: hidden; margin-top: 4px;
    }
    .progress > i { display: block; height: 100%; background: var(--c, var(--lamp)); }

    #view-store, #view-channels, #view-spec, #view-settings { overflow: auto; padding: 20px 24px 48px; align-content: start; }
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr));
      gap: 14px;
      width: 100%;
    }
    .card {
      background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 16px;
    }
    .card h3 { margin: 0 0 6px; font-size: 16px; }
    .card p, .muted { color: var(--muted); font-size: 13px; line-height: 1.6; }
    .url { font-family: var(--mono); font-size: 12px; word-break: break-all; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .status {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--raised);
    }
    .status.ok { background: #e7f2ec; color: var(--weread); }
    .status.warn { background: var(--lamp-soft); color: #7a4e10; }

    #view-reader { grid-template-columns: 220px minmax(0, 1fr) 300px; }
    .reader-side { border-right: 1px solid var(--line); overflow: auto; background: #f4f7f3; padding: 16px; }
    .cover-lg {
      height: 160px; border-radius: 4px 12px 12px 4px; margin-bottom: 12px;
      background: linear-gradient(160deg, var(--c), #1a211c);
      color: #f6f3ec; padding: 14px 12px;
      font-family: var(--display); font-size: 22px; writing-mode: vertical-rl; letter-spacing: .14em;
    }
    .reader-meta h1 { font-size: 18px; font-family: var(--display); font-weight: 400; }
    .chapters { display: flex; flex-direction: column; gap: 4px; margin-top: 14px; }
    .chapters button {
      border: 0; background: transparent; text-align: left; padding: 8px; border-radius: 8px; font-size: 13px;
    }
    .chapters button.on { background: #fff; }
    .reader-main { overflow: auto; background: var(--paper); min-width: 0; }
    .reader-top {
      position: sticky; top: 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
      padding: 10px 18px; background: color-mix(in srgb, var(--paper) 88%, #fff);
      border-bottom: 1px solid #eadfca; z-index: 1;
    }
    .article { max-width: 720px; margin: 0 auto; padding: 28px 24px 80px; line-height: 1.9; font-size: 16px; }
    .article h2 { font-family: var(--display); font-size: 26px; font-weight: 400; }
    .hl { background: #f3e4c8; border-bottom: 1px solid var(--lamp); }
    .note {
      border-left: 3px solid var(--lamp); padding: 8px 12px; margin: 0;
      background: #fff8ea; font-size: 14px; color: #5b4a2a;
    }
    .hl-item, .note-item {
      padding: 12px 0; border-bottom: 1px dashed #eadfca;
    }
    .notes-pane {
      border-left: 1px solid var(--line); background: #f7f9f6;
      display: grid; grid-template-rows: auto auto 1fr; min-height: 0; min-width: 0;
    }
    .notes-head { padding: 12px 14px 8px; border-bottom: 1px solid var(--line); }
    .notes-head h2 { margin: 0; font-size: 14px; }
    .notes-head .path { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: 4px; word-break: break-all; }
    .note-composer { padding: 10px 14px; border-bottom: 1px solid var(--line); }
    .note-composer textarea { min-height: 72px; }
    .notes-list { overflow: auto; padding: 4px 14px 24px; }
    .note-item { display: grid; gap: 6px; }
    .note-item .muted { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
    .webview {
      margin: 16px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: #fff;
      min-height: calc(100% - 32px);
    }
    .wv-bar {
      display: flex; align-items: center; gap: 8px; padding: 8px 12px;
      background: #eef2ed; border-bottom: 1px solid var(--line); font-size: 12px;
    }
    .wv-dots { width: 10px; height: 10px; border-radius: 50%; background: var(--c, var(--weread)); }
    .wv-url { font-family: var(--mono); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .wv-body { padding: 28px 24px 40px; line-height: 1.8; }
    .wv-body h2 { font-family: var(--display); font-weight: 400; font-size: 24px; margin: 0 0 8px; }

    .modal {
      position: fixed; inset: 0; background: rgba(26,33,28,.42);
      display: none; place-items: center; padding: 20px; z-index: 20;
    }
    .modal.on { display: grid; }
    .dialog {
      width: min(640px, 100%); background: #fff; border-radius: 16px; padding: 20px;
      box-shadow: 0 20px 50px rgba(26,33,28,.25);
    }
    .drop {
      border: 1.5px dashed var(--line); border-radius: 12px; padding: 28px; text-align: center;
      background: var(--raised); color: var(--muted);
    }
    .drop.over { border-color: var(--weread); background: #e7f2ec; color: var(--weread); }

    .bind-dialog { width: min(440px, 100%); }
    .bind-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; text-align: left; }
    .bind-head h2 { margin: 0; font-size: 18px; }
    .bind-tabs {
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px;
      background: var(--raised); border-radius: 10px; padding: 4px; margin: 14px 0 12px;
    }
    .bind-tabs button {
      border: 0; background: transparent; color: var(--muted);
      padding: 8px 6px; border-radius: 8px; font-size: 13px; font-weight: 600;
    }
    .bind-tabs button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.06); }
    .qr-pane { text-align: center; }
    .qr-well {
      --c: var(--weread);
      width: 216px; height: 216px; margin: 8px auto 12px;
      display: grid; place-items: center; position: relative;
    }
    .qr-well::before, .qr-well::after,
    .qr-well i::before, .qr-well i::after {
      content: ""; position: absolute; width: 22px; height: 22px; border: 2px solid var(--c);
    }
    .qr-well::before { top: 0; left: 0; border-right: 0; border-bottom: 0; }
    .qr-well::after { top: 0; right: 0; border-left: 0; border-bottom: 0; }
    .qr-well i::before { bottom: 0; left: 0; border-right: 0; border-top: 0; }
    .qr-well i::after { bottom: 0; right: 0; border-left: 0; border-top: 0; }
    .qr-well i { position: absolute; inset: 0; pointer-events: none; }
    .qr-well svg { width: 176px; height: 176px; background: #fff; }
    .qr-well.ok svg { opacity: .28; }
    .qr-stamp {
      position: absolute; inset: 0; display: none; place-items: center;
      font-family: var(--display); font-size: 28px; color: var(--weread);
    }
    .qr-well.ok .qr-stamp { display: grid; }
    .paste-pane label { display: block; text-align: left; font-size: 12px; color: var(--muted); margin: 8px 0 6px; }
    .web-pane { text-align: left; }

    .toast-wrap {
      position: fixed; right: 16px; bottom: 16px; display: grid; gap: 8px; z-index: 30;
    }
    .toast {
      background: #1a211c; color: #f6f3ec; padding: 10px 14px; border-radius: 10px;
      font-size: 13px; box-shadow: 0 8px 20px rgba(0,0,0,.2);
    }

    .spec { width: 100%; min-width: 0; }
    #view-spec .spec { max-width: 880px; }
    .lead { max-width: 72ch; }
    .setting {
      display: grid; grid-template-columns: minmax(0, 1fr) minmax(220px, 280px);
      gap: 16px; align-items: center;
      padding: 16px 0; border-bottom: 1px solid var(--line); max-width: 820px;
    }
    .setting h3 { margin: 0 0 4px; font-size: 14px; font-weight: 600; }
    .setting .ctrl { display: grid; gap: 8px; }
    .preview-path {
      font-family: var(--mono); font-size: 13px; background: #fff;
      border: 1px dashed var(--line); border-radius: 8px; padding: 10px 12px;
      max-width: 820px; margin-top: 8px;
    }
    .toggle {
      width: 40px; height: 22px; border-radius: 99px; border: 0;
      background: #c5cfc6; position: relative; justify-self: end;
    }
    .toggle.on { background: var(--weread); }
    .toggle i {
      position: absolute; top: 3px; left: 3px; width: 16px; height: 16px;
      border-radius: 50%; background: #fff; display: block; transition: left .15s;
    }
    .toggle.on i { left: 21px; }
    .spec h2 { font-family: var(--display); font-size: 28px; margin: 8px 0 12px; }
    .spec h3 { margin: 22px 0 8px; font-size: 16px; }
    .spec .setting h3 { margin: 0 0 4px; font-size: 14px; }
    .spec ul { margin: 0; padding-left: 1.2em; line-height: 1.7; }
    .prio { display: inline-block; font-family: var(--mono); font-size: 11px; padding: 1px 6px; border-radius: 4px; }
    .p0 { background: #e7f2ec; color: var(--weread); }
    .p1 { background: var(--lamp-soft); color: #7a4e10; }
    .p2 { background: var(--raised); color: var(--muted); }

    @media (max-width: 1100px) {
      #view-reader { grid-template-columns: 1fr; }
      .reader-side, .notes-pane { border: 0; border-bottom: 1px solid var(--line); max-height: 36vh; }
      .notes-pane { border-bottom: 0; border-top: 1px solid var(--line); max-height: 42vh; }
    }
    @media (max-width: 860px) {
      #view-shelf { grid-template-columns: 1fr; }
      .side { border-right: 0; border-bottom: 1px solid var(--line); max-height: 42vh; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="obsidian">
    <nav class="ribbon" aria-label="Obsidian 侧栏">
      <button title="文件">📁</button>
      <button class="active" title="Z-Read" data-act="nav" data-view="shelf">📖</button>
      <button title="搜索">🔎</button>
    </nav>
    <div class="workspace">
      <header>
        <div class="brand">Z-Read <small>在线读书管理 · 原型</small></div>
        <nav class="tabs" aria-label="主视图">
          <button data-act="nav" data-view="shelf" class="on">书架</button>
          <button data-act="nav" data-view="store">书城入口</button>
          <button data-act="nav" data-view="channels">渠道绑定</button>
          <button data-act="nav" data-view="settings">设置</button>
          <button data-act="nav" data-view="spec">需求拆分</button>
        </nav>
        <div class="spacer"></div>
        <button class="ghost" data-act="open-import">导入书籍</button>
        <button class="btn" data-act="sync-all">同步已绑定渠道</button>
      </header>
      <main>
        <section id="view-shelf" class="view on"></section>
        <section id="view-store" class="view"></section>
        <section id="view-channels" class="view"></section>
        <section id="view-reader" class="view"></section>
        <section id="view-settings" class="view"></section>
        <section id="view-spec" class="view"></section>
      </main>
    </div>
  </div>

  <div id="import-modal" class="modal" role="dialog" aria-labelledby="import-title">
    <div class="dialog">
      <h2 id="import-title" style="margin:0 0 8px;font-size:18px;">导入本地书籍</h2>
      <p class="muted">原型支持真实读取 TXT / Markdown；EPUB / PDF / MOBI 只登记到书架（正式插件再解析）。</p>
      <div id="dropzone" class="drop">把文件拖到这里，或
        <label class="btn" style="display:inline-block;margin-top:10px;">选择文件
          <input id="file-input" type="file" accept=".txt,.md,.epub,.pdf,.mobi,.azw3" multiple hidden />
        </label>
      </div>
      <div class="row">
        <button class="ghost" data-act="close-import">取消</button>
      </div>
    </div>
  </div>
  <div id="bind-modal" class="modal" role="dialog" aria-labelledby="bind-title">
    <div class="dialog bind-dialog" id="bind-body"></div>
  </div>
  <div class="toast-wrap" id="toasts"></div>

  <script>
    const SOURCES = {
      weread: {
        id: "weread", name: "微信读书", url: "https://weread.qq.com", color: "var(--weread)",
        bind: "扫码获取 API Key", qrApp: "微信",
        qrHint: "对标 Weread 插件：弹出二维码，微信扫码后自动写入 API Key。",
        pasteLabel: "API Key", pastePh: "wr_key_…",
        pasteHint: "手机可打开 weread.qq.com/api/skills/apikeyGet 复制 Key 再粘贴。",
        cookieLabel: "Cookie（备选）", cookiePh: "wr_skey=…",
        webLogin: "https://weread.qq.com"
      },
      fanqie: {
        id: "fanqie", name: "番茄小说", url: "https://fanqienovel.com", color: "var(--fanqie)",
        bind: "抖音 / 番茄 App 扫码", qrApp: "抖音或番茄",
        qrHint: "用抖音或番茄 App 扫码授权书架。正式插件走官方登录页，原型用扫码演示。",
        pasteLabel: "用户 ID", pastePh: "填写账号 ID",
        pasteHint: "没有扫码时，可粘贴用户 ID 或登录 Cookie。",
        cookieLabel: "Cookie（备选）", cookiePh: "sessionid=…",
        webLogin: "https://fanqienovel.com"
      },
      qidian: {
        id: "qidian", name: "起点中文网", url: "https://www.qidian.com", color: "var(--qidian)",
        bind: "QQ / 微信扫码", qrApp: "QQ 或微信",
        qrHint: "起点常用 QQ / 微信扫码登录。扫过之后同步书架和进度。",
        pasteLabel: "用户 ID", pastePh: "填写账号 ID",
        pasteHint: "也可粘贴账号 ID，或从浏览器复制登录 Cookie。",
        cookieLabel: "Cookie（备选）", cookiePh: "ywguid=…",
        webLogin: "https://passport.yuewen.com"
      },
      jjwxc: {
        id: "jjwxc", name: "晋江文学城", url: "https://www.jjwxc.net", color: "var(--jjwxc)",
        bind: "网页登录 / 粘贴 Cookie", qrApp: "晋江 App",
        qrHint: "晋江以网页登录为主。原型仍给一张码，方便走同一套快捷绑定。",
        pasteLabel: "用户 ID", pastePh: "填写账号 ID",
        pasteHint: "推荐打开登录页，登录后点「我已登录」；或粘贴 Cookie。",
        cookieLabel: "Cookie（备选）", cookiePh: "token=…",

        .replaceAll("{{title}}", book.title || "未命名")
        .replaceAll("{{author}}", book.author || "佚名")
        .replaceAll("{{source}}", src.name || "");
      name = sanitizeSeg(name) || "未命名";
      if (!name.toLowerCase().endsWith(".md")) name += ".md";
      const parts = [cfg.notesFolder.replace(/\\/g, "/").replace(/^\/+|\/+$/g, "")];
      if (cfg.subfolder === "source") parts.push(sanitizeSeg(src.name));
      if (cfg.subfolder === "book") parts.push(sanitizeSeg(book.title || "未命名"));
      parts.push(name);

    let bindUi = { id: null, tab: "qr", seed: "", ok: false };

    function qrSvg(seed) {
      const n = 21;
      const grid = Array.from({ length: n }, () => Array(n).fill(0));
      let h = 2166136261;
      for (const ch of String(seed)) h = Math.imul(h ^ ch.charCodeAt(0), 16777619);
      const bit = () => { h = Math.imul(h ^ (h >>> 13), 1274126177); return (h >>> 0) & 1; };
      const finder = (ox, oy) => {
        for (let y = 0; y < 7; y++) for (let x = 0; x < 7; x++) {
          const edge = x === 0 || y === 0 || x === 6 || y === 6;
          const inner = x >= 2 && x <= 4 && y >= 2 && y <= 4;
          grid[oy + y][ox + x] = edge || inner ? 1 : 0;
        }
      };
      finder(0, 0); finder(n - 7, 0); finder(0, n - 7);
      for (let i = 8; i < n - 8; i++) { grid[6][i] = i % 2 === 0 ? 1 : 0; grid[i][6] = i % 2 === 0 ? 1 : 0; }
      for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
        if ((x < 8 && y < 8) || (x >= n - 8 && y < 8) || (x < 8 && y >= n - 8) || x === 6 || y === 6) continue;
        grid[y][x] = bit();
      }
      const cells = [];
      for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
        if (grid[y][x]) cells.push(`<rect x="${x}" y="${y}" width="1" height="1"/>`);
      }
      return `<svg viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges" aria-hidden="true">${cells.join("")}</svg>`;
    }

    function mockToken(id) {
      const tail = Math.random().toString(16).slice(2, 8);

    function startQrWait() {
      clearTimeout(qrTimer);
      bindUi.ok = false;
      qrTimer = setTimeout(() => {
        if (!document.getElementById("bind-modal").classList.contains("on")) return;
        if (bindUi.tab !== "qr") return;
        bindUi.ok = true;
        renderBindModal();
        setTimeout(() => completeBind(bindUi.id, mockToken(bindUi.id), "qr"), 700);
      }, 12000);

    function completeBind(id, account, method) {

      const bound = Object.entries(state.channels).filter(([, c]) => c.bound);

    function importFiles(files) {
      [...files].forEach((file) => {
        const ext = (file.name.split(".").pop() || "").toLowerCase();
        const title = file.name.replace(/\.[^.]+$/, "");
        const book = {
          id: "loc-" + Date.now() + Math.random().toString(16).slice(2, 6),
          source: "local", title, author: "本地", progress: 0, lastRead: today(),
          format: ext, chapters: ["全文"], text: "", highlights: [], notes: []
        };
        if (ext === "txt" || ext === "md") {
          const reader = new FileReader();
          reader.onload = () => {
            book.text = String(reader.result || "");
            state.books.unshift(book); save(); render();
            toast("已导入 " + file.name);
          };
          reader.readAsText(file, "utf-8");
        } else {
          book.text = `【${ext.toUpperCase()} 占位】正式插件将解析 ${file.name}。当前只把这本书放到本地架。`;
          state.books.unshift(book); save(); toast("已登记 " + file.name + "（暂不解析正文）");
        }
      });
      document.getElementById("import-modal").classList.remove("on");
      state.view = "shelf"; state.filter = "local"; render();
    }
    function today() { return new Date().toISOString().slice(0, 10); }
    function now() {
      const d = new Date();
      const p = (n) => String(n).padStart(2, "0");
      return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
    }
    function markHighlights(html, highlights) {
      let out = html;
      (highlights || []).forEach((h) => {
        const t = escapeHtml(h.text);
        if (t && out.includes(t)) out = out.replace(t, `<mark class="hl">${t}</mark>`);
      });
      return out;
    }
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }
    function escapeAttr(s) { return escapeHtml(s); }

    document.body.addEventListener("click", (e) => {

      if (act === "mode") { state.mode = t.dataset.id; save(); renderShelf(); }

      if (act === "clip-hl") {

      if (act === "close-import") document.getElementById("import-modal").classList.remove("on");
      if (act === "open-bind") openBind(t.dataset.id, t.dataset.tab || "qr");

        bindUi.tab = t.dataset.tab;

        renderBindModal();
        if (bindUi.tab === "qr") startQrWait();

      if (act === "qr-refresh") {
        bindUi.seed = bindUi.id + "-" + Date.now();

        renderBindModal();
        startQrWait();
      }
      if (act === "qr-done") completeBind(bindUi.id, mockToken(bindUi.id), "qr");
      if (act === "bind-paste") bindPaste();
      if (act === "bind-web") completeBind(bindUi.id, "web_" + mockToken(bindUi.id), "web");
      if (act === "unbind") {
        const ch = state.channels[t.dataset.id];
        ch.bound = false; ch.lastSync = ""; ch.account = ""; ch.method = "";
        save(); toast("已解除 " + SOURCES[t.dataset.id].name); renderChannels();
      }
      if (act === "sync-all") syncAll();
      if (act === "remove-book") {
        state.books = state.books.filter((b) => b.id !== t.dataset.id);
        state.view = "shelf"; state.selectedId = null; save(); toast("已移出书架"); render();
      }
      if (act === "add-platform") {
        const name = document.getElementById("np-name").value.trim();

        if (!name || !url) { toast("名称和网址都要填"); return; }
        state.customPlatforms.push({ id: "c-" + Date.now(), name, url, desc: "自定义入口" });
        save(); toast("已加入书城"); renderStore();
      }
      if (act === "toggle-daily") {
        applySetting("dailyNotes", !settings().dailyNotes);
        renderSettings();
      }
    });
    document.body.addEventListener("input", (e) => {
      const el = e.target;

    const drop = document.getElementById("dropzone");
    const input = document.getElementById("file-input");
    drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
    drop.addEventListener("dragleave", () => drop.classList.remove("over"));
    drop.addEventListener("drop", (e) => { e.preventDefault(); drop.classList.remove("over"); importFiles(e.dataTransfer.files); });
    input.addEventListener("change", () => importFiles(input.files));

    render();
  </script>
</body>
</html>
